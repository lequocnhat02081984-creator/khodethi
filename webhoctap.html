<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Toán Học Thông Minh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-5xl mx-auto p-6">
        <div class="bg-blue-600 p-6 rounded-t-2xl text-white flex justify-between items-center">
            <h1 class="text-2xl font-bold">MATH HUB PRO</h1>
            <div id="v-count" class="bg-blue-800 px-4 py-1 rounded-full text-sm">Lượt truy cập: ...</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
            <!-- Cột trái: Kho đề -->
            <div class="bg-white p-4 rounded-xl shadow">
                <h3 class="font-bold border-b mb-3">KHO ĐỀ TRỰC TUYẾN</h3>
                <div id="fileList" class="space-y-2 text-sm">Đang tải...</div>
            </div>

            <!-- Cột phải: Xử lý -->
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow">
                    <input type="file" id="fileInp" class="mb-4 block w-full border p-2 rounded">
                    <div class="flex gap-4">
                        <button onclick="handleAction('upload')" class="bg-green-600 text-white px-4 py-2 rounded flex-1">LƯU VÀO KHO</button>
                        <button onclick="handleAction('solve')" class="bg-blue-600 text-white px-4 py-2 rounded flex-1">GIẢI BẰNG AI</button>
                    </div>
                </div>
                <div id="result" class="bg-white p-6 rounded-xl shadow hidden prose max-w-none"></div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "DÁN_WEB_APP_URL_VÀO_ĐÂY";

        async function handleAction(action) {
            const file = document.getElementById('fileInp').files[0];
            if (!file) return alert("Vui lòng chọn file!");

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                document.body.style.cursor = 'wait';

                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ action, base64, type: file.type, name: file.name })
                    });
                    const data = await res.json();
                    
                    if (action === 'solve') {
                        document.getElementById('result').classList.remove('hidden');
                        document.getElementById('result').innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
                        MathJax.typesetPromise();
                    } else {
                        alert("Đã tải lên thành công!");
                        loadFiles();
                    }
                } catch (e) { alert("Lỗi xử lý!"); }
                document.body.style.cursor = 'default';
            };
        }

        async function loadFiles() {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            const list = document.getElementById('fileList');
            list.innerHTML = data.slice(1).map(row => `
                <div class="flex justify-between border-b py-2">
                    <span class="truncate w-32">${row[0]}</span>
                    <a href="${row[1]}" target="_blank" class="text-blue-600">Tải</a>
                </div>
            `).join('');
        }

        window.onload = loadFiles;
    </script>
</body>
</html>
